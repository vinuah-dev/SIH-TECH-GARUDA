<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IBVAP — Command Dashboard</title>
<style>
  :root {
    --bg: #0e1116; --panel: #161b22; --line: #262d38; --text: #e6edf3;
    --dim: #8b949e; --low: #3fb950; --medium: #d29922; --high: #f85149;
    --critical: #db61ff; --accent: #58a6ff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.5 ui-monospace, "Cascadia Code", Consolas, monospace;
  }
  header {
    padding: 14px 20px; border-bottom: 1px solid var(--line);
    display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap;
  }
  h1 { font-size: 15px; margin: 0; letter-spacing: .06em; }
  .sub { color: var(--dim); font-size: 12px; }
  .live { margin-left: auto; font-size: 12px; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%;
         background: var(--high); margin-right: 6px; vertical-align: middle; }
  .dot.on { background: var(--low); }
  main { display: grid; grid-template-columns: 320px 1fr; gap: 16px; padding: 16px; }
  @media (max-width: 800px) { main { grid-template-columns: 1fr; } }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; }
  h2 { font-size: 11px; letter-spacing: .12em; color: var(--dim);
       margin: 0; padding: 10px 14px; border-bottom: 1px solid var(--line); }
  .body { padding: 12px 14px; }
  .row { display: flex; justify-content: space-between; gap: 12px; padding: 4px 0; }
  .row .k { color: var(--dim); }
  .cam { padding: 10px 0; border-bottom: 1px solid var(--line); }
  .cam:last-child { border-bottom: 0; }
  .cam .name { font-weight: 600; }
  .pill { font-size: 11px; padding: 1px 7px; border-radius: 10px;
          border: 1px solid var(--line); color: var(--dim); }
  .pill.ok { color: var(--low); border-color: var(--low); }
  .pill.bad { color: var(--high); border-color: var(--high); }
  .alerts { max-height: 74vh; overflow-y: auto; }
  .alert { padding: 12px 14px; border-bottom: 1px solid var(--line); }
  .alert:last-child { border-bottom: 0; }
  .alert.new { animation: flash 1.4s ease-out; }
  @keyframes flash { from { background: #1f2b3a; } to { background: transparent; } }
  .alert .top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .score { font-weight: 700; font-size: 16px; }
  .LOW { color: var(--low); } .MEDIUM { color: var(--medium); }
  .HIGH { color: var(--high); } .CRITICAL { color: var(--critical); }
  .type { font-weight: 600; }
  .when { color: var(--dim); font-size: 12px; margin-left: auto; }
  .tags { margin-top: 6px; display: flex; gap: 6px; flex-wrap: wrap; }
  .tag { font-size: 11px; padding: 1px 7px; border-radius: 3px;
         background: #21262d; color: var(--accent); }
  .plate { font-weight: 700; letter-spacing: .09em; padding: 1px 8px;
           border-radius: 3px; background: #f2f2f2; color: #101010;
           border: 1px solid #999; }
  .reg { font-size: 12px; color: var(--dim); margin-top: 6px; }
  .reg.bad { color: var(--high); font-weight: 600; }
  .reg.flag { color: var(--critical); font-weight: 600; }
  .files { margin-top: 6px; font-size: 11px; color: var(--dim); }
  .files span { margin-right: 10px; }
  .why { color: var(--dim); font-size: 12px; margin-top: 6px; }
  .factors { margin-top: 6px; font-size: 12px; color: var(--dim); }
  .factors span { margin-right: 12px; white-space: nowrap; }
  .empty { color: var(--dim); padding: 24px 14px; text-align: center; }
  .toggle { margin-left: auto; display: flex; gap: 4px; }
  .toggle button {
    font: inherit; font-size: 11px; letter-spacing: .08em; cursor: pointer;
    background: transparent; color: var(--dim); border: 1px solid var(--line);
    border-radius: 3px; padding: 2px 10px;
  }
  .toggle button.on { color: var(--text); border-color: var(--accent); }
  .count { font-size: 11px; color: var(--dim); }
</style>
</head>
<body>
<header>
  <h1>IBVAP — INTELLIGENT BORDER VIDEO ANALYTICS</h1>
  <span class="sub">Ministry of Home Affairs · Sashastra Seema Bal</span>
  <span class="live"><span class="dot" id="dot"></span><span id="conn">connecting…</span></span>
</header>

<main>
  <div>
    <section>
      <h2>FLEET</h2>
      <div class="body" id="fleet"><div class="empty">waiting…</div></div>
    </section>
    <section style="margin-top:16px">
      <h2>TOTALS</h2>
      <div class="body" id="totals"><div class="empty">waiting…</div></div>
    </section>
    <section style="margin-top:16px">
      <h2>BEHAVIOURS SEEN</h2>
      <div class="body" id="behaviours"><div class="empty">none yet</div></div>
    </section>
  </div>

  <section>
    <h2 style="display:flex;align-items:center">
      <span id="listTitle">ALERTS — NEWEST FIRST</span>
      <span class="toggle">
        <button id="tabAlerts" class="on">ALERTS</button>
        <button id="tabIncidents">INCIDENTS</button>
      </span>
    </h2>
    <div class="alerts" id="alerts"><div class="empty">no alerts yet</div></div>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id);
const MAX_ALERTS = 200;
let seen = new Set();

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => (
    {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]
  ));
}

function timeOf(iso) {
  return esc(String(iso).replace("T", " ").slice(0, 19));
}

function alertNode(ev, isNew) {
  const sev = esc(ev.risk.severity);
  const el = document.createElement("div");
  el.className = "alert" + (isNew ? " new" : "");
  const behaviours = (ev.behaviours || [])
    .map(b => `<span class="tag">${esc(b.name)}</span>`).join("");

  // A plate is the single most actionable thing on a vehicle alert, and a
  // plate that does not match its vehicle is the reason to stop it.
  const plate = ev.plate
    ? `<span class="plate">${esc(ev.plate.display || ev.plate.text)}</span>`
    : "";

  let registry = "";
  if (ev.registry) {
    const rec = ev.registry.record || {};
    const described = [rec.colour, rec.make, rec.model].filter(Boolean).join(" ");
    if (!ev.registry.known) {
      registry = `<div class="reg">not in registry extract</div>`;
    } else if (ev.registry.flagged) {
      registry = `<div class="reg flag">${esc(rec.status)} — ${esc(ev.registry.detail)}</div>`;
    } else if (ev.registry.mismatch) {
      registry = `<div class="reg bad">PLATE MISMATCH — ${esc(ev.registry.detail)}</div>`;
    } else {
      registry = `<div class="reg">registered: ${esc(rec.vehicle_class || "?")}` +
                 `${described ? " — " + esc(described) : ""}</div>`;
    }
  }

  const files = [
    ev.evidence_path ? "<span>still</span>" : "",
    ev.clip_path ? "<span>clip</span>" : "",
    ev.plate_path ? "<span>plate image</span>" : "",
  ].join("");
  const factors = (ev.risk.factors || [])
    .map(f => `<span>${f.points >= 0 ? "+" : ""}${f.points} ${esc(f.label)}</span>`).join("");
  el.innerHTML =
    `<div class="top">
       <span class="score ${sev}">${ev.risk.score}</span>
       <span class="${sev}">${sev}</span>
       <span class="type">${esc(ev.event_type)}</span>
       <span class="pill">${esc(ev.camera_id)}</span>
       ${ev.zone ? `<span class="pill">${esc(ev.zone.name)}</span>` : ""}
       ${plate}
       <span class="when">${timeOf(ev.timestamp)}</span>
     </div>
     ${registry}
     ${behaviours ? `<div class="tags">${behaviours}</div>` : ""}
     <div class="why">${esc(ev.risk.reason)}</div>
     <div class="factors">${factors}</div>
     ${files ? `<div class="files">${files}</div>` : ""}`;
  return el;
}

function addAlert(ev, isNew) {
  if (seen.has(ev.event_id)) return;
  seen.add(ev.event_id);
  const box = $("alerts");
  const empty = box.querySelector(".empty");
  if (empty) empty.remove();
  box.prepend(alertNode(ev, isNew));
  while (box.children.length > MAX_ALERTS) box.lastChild.remove();
}

function incidentNode(inc) {
  const sev = esc(inc.peak_severity);
  const el = document.createElement("div");
  el.className = "alert";
  const behaviours = (inc.behaviours || [])
    .map(b => `<span class="tag">${esc(b)}</span>`).join("");
  const plate = inc.plate
    ? `<span class="plate">${esc(inc.plate)}</span>` : "";
  const span = inc.started === inc.ended
    ? timeOf(inc.ended)
    : `${timeOf(inc.started).slice(11)} – ${timeOf(inc.ended)}`;
  el.innerHTML =
    `<div class="top">
       <span class="score ${sev}">${inc.peak_score}</span>
       <span class="${sev}">${sev}</span>
       <span class="type">${esc(inc.object || "EVENT")}</span>
       ${(inc.cameras || []).map(c => `<span class="pill">${esc(c)}</span>`).join("")}
       ${plate}
       <span class="when">${span}</span>
     </div>
     <div class="why">${inc.events} event${inc.events === 1 ? "" : "s"}` +
       `${inc.zones && inc.zones.length ? " · " + inc.zones.map(esc).join(", ") : ""}</div>
     ${behaviours ? `<div class="tags">${behaviours}</div>` : ""}`;
  return el;
}

let view = "alerts";

async function renderIncidents() {
  const box = $("alerts");
  try {
    const data = await fetch("/api/incidents").then(r => r.json());
    box.innerHTML = "";
    if (!data.count) {
      box.innerHTML = '<div class="empty">no incidents yet</div>';
      return;
    }
    data.incidents.forEach(inc => box.appendChild(incidentNode(inc)));
  } catch (e) {
    box.innerHTML = '<div class="empty">could not load incidents</div>';
  }
}

function setView(next) {
  view = next;
  $("tabAlerts").classList.toggle("on", next === "alerts");
  $("tabIncidents").classList.toggle("on", next === "incidents");
  $("listTitle").textContent =
    next === "alerts" ? "ALERTS — NEWEST FIRST" : "INCIDENTS — GROUPED";
  if (next === "incidents") {
    renderIncidents();
  } else {
    // Rebuild the alert list from the store rather than keeping two in sync.
    const box = $("alerts");
    box.innerHTML = '<div class="empty">no alerts yet</div>';
    seen = new Set();
    fetch("/api/events?limit=50").then(r => r.json())
      .then(d => d.events.slice().reverse().forEach(ev => addAlert(ev, false)))
      .catch(() => {});
  }
}

$("tabAlerts").onclick = () => setView("alerts");
$("tabIncidents").onclick = () => setView("incidents");

function renderStatus(s) {
  const fleet = $("fleet");
  const cams = s.cameras || [];
  if (!cams.length && !(s.skipped || []).length) {
    fleet.innerHTML = '<div class="empty">no cameras</div>';
  } else {
    fleet.innerHTML =
      cams.map(c => {
        const link = c.link ? c.link.state : (c.running ? "RUNNING" : "STOPPED");
        const ok = c.running && link !== "OFFLINE";
        return `<div class="cam">
          <div class="row">
            <span class="name">${esc(c.camera_id)}</span>
            <span class="pill ${ok ? "ok" : "bad"}">${esc(link)}</span>
          </div>
          <div class="row"><span class="k">frames</span><span>${c.frames}</span></div>
          <div class="row"><span class="k">alerts</span><span>${c.alerts}</span></div>
          <div class="row"><span class="k">fps</span><span>${c.fps}</span></div>
        </div>`;
      }).join("") +
      (s.skipped || []).map(k => `<div class="cam">
          <div class="row">
            <span class="name">${esc(k.camera_id)}</span>
            <span class="pill bad">SKIPPED</span>
          </div>
          <div class="row"><span class="k">${esc(k.reason)}</span><span></span></div>
        </div>`).join("");
  }
  $("totals").innerHTML =
    `<div class="row"><span class="k">cameras</span><span>${cams.length}</span></div>
     <div class="row"><span class="k">alerts</span><span>${s.total_alerts ?? 0}</span></div>
     <div class="row"><span class="k">model</span><span>${esc(s.model_sharing)}</span></div>
     <div class="row"><span class="k">dashboards</span><span>${s.dashboards_connected ?? 1}</span></div>`;
}

async function refreshSide() {
  try {
    const [status, behaviours] = await Promise.all([
      fetch("/api/status").then(r => r.json()),
      fetch("/api/behaviours").then(r => r.json()),
    ]);
    renderStatus(status);
    const keys = Object.keys(behaviours);
    $("behaviours").innerHTML = keys.length
      ? keys.map(k => `<div class="row"><span class="k">${esc(k)}</span><span>${behaviours[k]}</span></div>`).join("")
      : '<div class="empty">none yet</div>';
  } catch (e) { /* the fleet may still be starting */ }
}

function connect() {
  const proto = location.protocol === "https:" ? "wss" : "ws";
  const ws = new WebSocket(`${proto}://${location.host}/ws`);

  ws.onopen = () => { $("dot").classList.add("on"); $("conn").textContent = "live"; };
  ws.onclose = () => {
    $("dot").classList.remove("on");
    $("conn").textContent = "reconnecting…";
    setTimeout(connect, 2000);
  };
  ws.onmessage = (msg) => {
    const data = JSON.parse(msg.data);
    if (data.type === "snapshot") {
      renderStatus(data.status);
      if (view === "alerts") {
        (data.events || []).slice().reverse().forEach(ev => addAlert(ev, false));
      }
    } else if (data.type === "alert") {
      if (view === "alerts") {
        addAlert(data.event, true);
      } else {
        renderIncidents();
      }
    }
  };
}

connect();
refreshSide();
setInterval(refreshSide, 2000);
</script>
</body>
</html>
